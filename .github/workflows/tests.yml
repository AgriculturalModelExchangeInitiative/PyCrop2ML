name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Python 3.${{ matrix.python-minor-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python-minor-version: [9, 10, 11]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.${{ matrix.python-minor-version }}
        uses: actions/setup-python@v5
        with:
          python-version: 3.${{ matrix.python-minor-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s test/cyml -p "test_cyml_operations.py" -v

  pytest:
    name: Full pytest suite on Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with test fixtures
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: pycropml-tests
          python-version: "3.12"
          channels: conda-forge,openalea3,amei
          channel-priority: strict

      - name: Install system and Python dependencies
        shell: bash -el {0}
        run: |
          conda install -y graphviz openalea.core
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run full pytest suite
        shell: bash -el {0}
        run: |
          python -m pytest \
            test \
            src/pycropml/transpiler/antlr_py/tests \
            --ignore=test/Tutorial \
            -v --tb=short
